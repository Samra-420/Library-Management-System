<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        /* Match user_register.html background */
        body {
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 900px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            padding: 30px 40px;
        }

        h2 {
            color: #198754; /* bootstrap success green */
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
        }

        table thead tr {
            background-color: #198754;
            color: white;
        }

        table tbody tr:hover {
            background-color: #e9f6ec;
        }

        /* Edit button: success green outline */
        .btn-edit {
            color: #198754;
            border: 2px solid #198754;
            background: transparent;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 8px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .btn-edit:hover {
            background-color: #198754;
            color: white;
            text-decoration: none;
        }

        /* Delete button: soft pink outline */
        .btn-delete {
            color: #d6336c;
            border: 2px solid #d6336c;
            background: transparent;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 8px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .btn-delete:hover {
            background-color: #d6336c;
            color: white;
            text-decoration: none;
        }

        /* Back button */
        .btn-back {
            background-color: #198754;
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 28px;
            border-radius: 8px;
            transition: background-color 0.3s ease;
            text-align: center;
        }
        .btn-back:hover {
            background-color: #146c43;
            color: white;
            text-decoration: none;
        }

        /* Add user button */
        .btn-register {
            background-color: #198754;
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 28px;
            border-radius: 8px;
            transition: background-color 0.3s ease;
            text-align: center;
        }
        .btn-register:hover {
            background-color: #146c43;
            color: white;
            text-decoration: none;
        }

        /* Buttons container aligned left and right above table */
        .buttons-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        /* Table adjustments */
        table {
            border-radius: 10px;
            overflow: hidden;
        }

        /* Action buttons spacing */
        .action-buttons > a:not(:last-child) {
            margin-right: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Manage Users</h2>

    <div class="buttons-container">
        <a href="{{ url_for('add_user') }}" class="btn btn-register">Add User</a>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-back">Back to Dashboard</a>
    </div>

    <table class="table table-bordered table-striped align-middle">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th style="width: 180px;">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>
                <td class="action-buttons">
                    <a href="{{ url_for('edit_user', user_id=user._id) }}" class="btn btn-edit btn-sm">Edit</a>
                    <a href="{{ url_for('delete_user', user_id=user._id) }}" class="btn btn-delete btn-sm" onclick="return confirm('Are you sure you want to delete this user?');">Delete</a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" class="text-center">No users found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
