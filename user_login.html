<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>User Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <style>
        body {
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 50px;
        }

        .login-card {
            width: 350px;
            margin: 0 auto;
            padding: 25px 30px;
            border-radius: 10px;
            background-color: #fff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            color: #198754;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
        }

        label {
            font-weight: 600;
        }

        input.form-control {
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 15px;
        }

        input.form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 8px #198754a6;
            outline: none;
        }

        .btn-login, .btn-back {
            background-color: #198754;
            color: white;
            font-weight: 600;
            border-radius: 6px;
            padding: 8px 15px;
            width: 48%;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-login:hover, .btn-back:hover {
            background-color: #146c43;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 38px;
            cursor: pointer;
            color: #6c757d;
            font-size: 18px;
            user-select: none;
        }

        .password-wrapper {
            position: relative;
        }

        .alert {
            border-radius: 10px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            text-align: center;
        }

        .g-recaptcha {
            margin: 15px 0;
            display: flex;
            justify-content: center;
        }

        p.register-link {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            font-size: 14px;
            color: #198754;
        }

        p.register-link a {
            color: #198754;
            text-decoration: none;
        }
        p.register-link a:hover {
            text-decoration: underline;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>User Login</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('user_login') }}" autocomplete="off" id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" name="email" id="email" class="form-control" required autocomplete="off" />
                <div class="invalid-feedback">Please enter your email.</div>
            </div>

            <div class="form-group password-wrapper">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control" required autocomplete="new-password" />
                <span class="toggle-password" onclick="togglePasswordVisibility()" title="Show/Hide Password">&#128065;</span>
                <div class="invalid-feedback">Please enter your password.</div>
            </div>

            <div class="g-recaptcha" data-sitekey="{{ site_key }}"></div>

            <div class="button-group">
                <button type="submit" class="btn-login">Login</button>
                <a href="{{ url_for('menu') }}" class="btn-back text-center">Back</a>
            </div>
        </form>

        <p class="register-link">
            Don't have an account? <a href="{{ url_for('user_register') }}">Register here</a>
        </p>
    </div>

    <script>
        (() => {
            'use strict';
            const form = document.getElementById('loginForm');
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        })();

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type');
            if (type === 'password') {
                passwordInput.setAttribute('type', 'text');
            } else {
                passwordInput.setAttribute('type', 'password');
            }
        }
    </script>

    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</body>
</html>
