<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Library Management System - Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }

        h1 {
            color: #198754;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .btn-role {
            margin: 8px 0;
            padding: 8px;
            width: 60%;
            font-size: 15px;
            font-weight: 600;
            border: none;
        }

        .btn-admin {
            background-color: #20c997; /* Soft green */
            color: white;
        }

        .btn-user {
            background-color: #339af0; /* Soft blue */
            color: white;
        }

        .btn-back {
            background-color: #20c997; /* Matching green */
            color: white;
            margin-top: 15px;
            padding: 6px 15px;
            font-size: 14px;
            font-weight: 600;
            float: left;
        }

        .btn-role:hover, .btn-back:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Select Your Role</h1>
        <a href="/admin_login" class="btn btn-role btn-admin">Admin</a><br>
        <a href="/user_login" class="btn btn-role btn-user">User</a><br>
        <a href="/" class="btn btn-back">Back</a>
    </div>
</body>
</html>
