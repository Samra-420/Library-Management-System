<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      background-color: #eef2f7;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 40px 0;
    }

    .card {
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      background-color: #fff;
    }

    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid #20c997;
      box-shadow: 0 5px 15px rgba(32, 201, 151, 0.3);
      object-fit: cover;
    }

    .form-control:focus {
      border-color: #20c997;
      box-shadow: 0 0 0 0.2rem rgba(32, 201, 151, 0.25);
    }

    .btn-primary {
      background-color: #20c997;
      border-color: #20c997;
      font-weight: 600;
      border-radius: 25px;
    }

    .btn-primary:hover {
      background-color: #17a673;
      border-color: #17a673;
    }

    .back-link {
      text-decoration: none;
      color: #6c757d;
      display: inline-block;
      margin-bottom: 15px;
    }

    .back-link:hover {
      color: #343a40;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
      <a href="{{ url_for('profile') }}" class="back-link"><i class="bi bi-arrow-left-circle"></i> Back to Profile</a>
      <div class="card p-4">
        <div class="text-center mb-4">
          <img src="{{ profile.profile_pic or url_for('static', filename='images/default_avatar.png') }}" alt="Avatar" class="avatar" />
          <h4 class="mt-3">{{ profile.full_name or profile.username }}</h4>
          <p class="text-muted">@{{ profile.username }}</p>
        </div>

        <form action="{{ url_for('update_profile') }}" method="POST">
          <div class="mb-3">
            <label for="full_name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="full_name" name="full_name" value="{{ profile.full_name or '' }}" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ profile.email or '' }}">
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="phone" name="phone" value="{{ profile.phone or '' }}">
          </div>

          <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <textarea class="form-control" id="address" name="address" rows="2">{{ profile.address or '' }}</textarea>
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>

</body>
</html>
