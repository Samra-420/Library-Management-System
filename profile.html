<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>User Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" rel="stylesheet" />

    <style>
        body {
            background-color: #eef2f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 0;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            background-color: #fff;
        }

        .avatar {
            max-width: 160px;
            border-radius: 50%;
            border: 4px solid #20c997;
            box-shadow: 0 5px 15px rgba(32, 201, 151, 0.3);
        }

        .card-body h4 {
            font-weight: 700;
            color: #343a40;
        }

        .card-body p {
            margin: 4px 0;
            color: #555;
        }

        .info-icon {
            color: #20c997;
            margin-right: 10px;
        }

        .edit-btn {
            margin-top: 20px;
            background-color: #20c997;
            border: none;
            padding: 10px 24px;
            color: white;
            font-weight: 600;
            border-radius: 25px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .edit-btn:hover {
            background-color: #17a673;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card p-4">
                <div class="row g-4 align-items-center">
                    
                    <!-- Profile Image -->
                    <div class="col-sm-4 text-center">
                        <img src="{{ profile.profile_pic or url_for('static', filename='images/default_avatar.png') }}" alt="Profile Picture" class="avatar img-fluid" />
                    </div>

                    <!-- Profile Details -->
                    <div class="col-sm-8">
                        <div class="card-body">
                            <h4>{{ profile.full_name or profile.username }}</h4>
                            <p class="text-muted">@{{ profile.username }}</p>

                            <p><i class="bi bi-envelope-fill info-icon"></i>Email: {{ profile.email or 'Not Provided' }}</p>
                            <p><i class="bi bi-telephone-fill info-icon"></i>Phone: {{ profile.phone or 'Not Provided' }}</p>
                            <p><i class="bi bi-geo-alt-fill info-icon"></i>Address: {{ profile.address or 'Not Provided' }}</p>

                            <a href="{{ url_for('edit_profile') }}" class="edit-btn">Edit Profile</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
