<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .welcome-card {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            width: 500px;
            text-align: center;
        }

        h1 {
            color: #198754;
            font-weight: 700;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .btn-next {
            background-color: #198754;
            color: white;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        .btn-next:hover {
            background-color: #146c43;
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <h1>Welcome to the Library</h1>
        <p>Explore, reserve books, and manage your library with ease.</p>
        <a href="/menu" class="btn btn-next">Next</a>
    </div>
</body>
</html>
