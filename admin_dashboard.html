<head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        .sidebar {
            height: 100vh;
            background-color: #0f362d;
            color: white;
            padding-top: 30px;
            position: fixed;
            width: 220px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 40px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s ease;
        }

        .sidebar a:hover, .sidebar a.active {
            background-color: #157347;
            border-left: 4px solid white;
        }

        .main {
            margin-left: 220px;
        }

        /* Changed top-navbar color to sidebar color */
        .top-navbar {
            background-color: #0f362d;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-navbar h4 {
            margin: 0;
        }

        .logout-btn {
            background-color: #dc3545;
            border: none;
            color: white;
            padding: 6px 12px;
            font-weight: 500;
            border-radius: 5px;
            text-decoration: none;
        }

        .logout-btn:hover {
            background-color: #c82333;
        }

        .content {
            padding: 30px;
        }

        /* Counters with full background colors */
        .card-summary {
            color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: none;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            font-weight: 600;
            font-size: 1.2rem;
        }

        /* Specific colors for each card */
        .card-total-books {
            background-color: #198754; /* green */
        }

        .card-issued-books {
            background-color: #0dcaf0; /* sky blue */
            color: #000; /* dark text for contrast */
        }

        .card-registered-users {
            background-color: #ffc107; /* yellow */
            color: #000;
        }

        /* Icon style inside cards */
        .card-summary i {
            font-size: 2.5rem;
        }

        .card-summary p {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .chart-container {
            background-color: white;
            padding: 20px;
            margin-top: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <a href="{{ url_for('admin_dashboard') }}" class="active"><i class="bi bi-speedometer2"></i>Dashboard</a>
        <a href="{{ url_for('view_books') }}"><i class="bi bi-book"></i>View All Books</a>
        <a href="{{ url_for('manage_users') }}"><i class="bi bi-people"></i>Manage Users</a>
        <a href="{{ url_for('manage_books') }}"><i class="bi bi-journal-bookmark"></i>Manage Books</a>
        <a href="{{ url_for('issued_books') }}"><i class="bi bi-journal-check"></i>Issued Books</a>
        <a href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right"></i>Logout</a>
    </div>

    <div class="main">
        <div class="top-navbar">
            <h4>Welcome, Admin</h4>
            <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
        </div>

        <div class="content">
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card-summary card-total-books">
                        <i class="bi bi-book-half"></i>
                        <div>
                            <h5>Total Books</h5>
                            <p>{{ total_books }}</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card-summary card-issued-books">
                        <i class="bi bi-box-arrow-up-right"></i>
                        <div>
                            <h5>Issued Books</h5>
                            <p>{{ issued_books }}</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card-summary card-registered-users">
                        <i class="bi bi-person-badge"></i>
                        <div>
                            <h5>Registered Users</h5>
                            <p>{{ total_users }}</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Small Chart Section -->
            <div class="chart-container mx-auto">
                <canvas id="bookChart" width="400" height="300"></canvas>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('bookChart').getContext('2d');
        const bookChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Total Books', 'Issued Books', 'Users'],
                datasets: [{
                    label: 'Library Stats',
                    data: [{{ total_books }}, {{ issued_books }}, {{ total_users }}],
                    backgroundColor: [
                        'rgba(25, 135, 84, 0.7)',
                        'rgba(13, 110, 253, 0.7)',
                        'rgba(255, 193, 7, 0.7)'
                    ],
                    borderColor: [
                        'rgba(25, 135, 84, 1)',
                        'rgba(13, 110, 253, 1)',
                        'rgba(255, 193, 7, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1
                        }
                    }
                }
            }
        });
    </script>
</body>
